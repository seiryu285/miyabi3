<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅 -MIYABI- | 3Dモデルギャラリー</title>
  <!-- 外部リソースへの接続を高速化 -->
  <link rel="preconnect" href="https://unpkg.com">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="preload" as="fetch" href="assets/models8.glb" crossorigin="anonymous">
  <link rel="preload" as="fetch" href="assets/models10.glb" crossorigin="anonymous">
  <link rel="preload" as="fetch" href="assets/models11.glb" crossorigin="anonymous">
  <link rel="preload" as="fetch" href="assets/models12.glb" crossorigin="anonymous">
  <link rel="preload" as="fetch" href="assets/models13.glb" crossorigin="anonymous">
  <link rel="preload" as="fetch" href="assets/models14.glb" crossorigin="anonymous">
  <meta name="description" content="日本の伝統美をモダンに表現した3Dアートギャラリー">
  <style>
    :root {
      --main-color: #2D2D2D;
      --accent-color: #B70033;
      --bg-color: #FAFAFA;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: "Yu Mincho", "MS Mincho", serif;
      background-color: var(--bg-color);
      color: var(--main-color);
    }
    
    /* ナビゲーション */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4rem;
      z-index: 3;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 2rem;
      gap: 2rem;
      mix-blend-mode: difference;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), transparent);
    }
    
    .nav a, .nav button {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      padding: 0.5rem;
      opacity: 0.7;
      transition: all 0.5s ease;
      position: relative;
      white-space: nowrap;
    }
    
    .nav a::after, .nav button::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background: #fff;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }
    
    .nav a:hover::after, .nav button:hover::after {
      width: 100%;
    }
    
    .nav a:hover, .nav button:hover, .nav .active {
      opacity: 1;
    }
    
    /* 言語切り替えボタン */
    .lang-btn {
      background: none;
      border: none;
      color: white;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.5s ease;
      position: relative;
      white-space: nowrap;
      padding: 0.5rem;
    }
    
    .lang-btn:hover {
      opacity: 1;
    }
    
    .lang-btn.active {
      opacity: 1;
    }
    
    .header {
      display: none;
    }
    
    .nav-links {
      display: none;
    }
    
    .model-gallery {
      margin-top: 80px;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .model-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    
    .model-card:hover {
      transform: translateY(-5px);
    }
    
    .model-viewer-container {
      position: relative;
      width: 100%;
      height: 300px;
      background-color: #f5f5f5;
      transition: all 0.5s ease;
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      will-change: transform;
    }
    
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    
    .loading-text {
      color: white;
      font-size: 1.2rem;
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .modal.show {
      opacity: 1;
    }
    
    .modal-content {
      width: 90%;
      height: 90%;
      max-width: 1200px;
      background: white;
      border-radius: 15px;
      padding: 2rem;
      position: relative;
      transform: scale(0.7) rotate(0deg);
      transition: transform 0.5s ease;
    }
    
    .modal.show .modal-content {
      transform: scale(1) rotate(360deg);
    }
    
    .modal model-viewer {
      width: 100%;
      height: calc(100% - 60px);
    }
    
    .close-button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 2rem;
      color: var(--main-color);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0.5rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">HOME</a>
    <a href="model-gallery.html" class="active">ITEMS</a>
    <a href="gallery.html">GALLERY</a>
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="jp">JP</button>
  </nav>

  <div class="model-gallery" id="modelGallery">
    <!-- 3Dモデルカードはスクリプトで動的に生成されます -->
  </div>

  <div id="loading" class="loading-container">
    <div class="loading-text">Loading 3D Models...</div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="close-button">&times;</button>
      <model-viewer id="modalViewer"
          camera-controls
          auto-rotate
          rotation-per-second="30deg"
          shadow-intensity="1"
          exposure="1">
      </model-viewer>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'miyabi-3d-models-v1';
    const modelData = [
      { src: 'assets/models8.glb', title: '日本の建築様式からインスピレーションを得た作品', description: '' },
      { src: 'assets/models10.glb', title: '日本の色彩感覚を表現した立体アート', description: '' },
      { src: 'assets/models11.glb', title: '自然と調和する日本の美意識', description: '' },
      { src: 'assets/models12.glb', title: 'デジタルと伝統の調和', description: '' },
      { src: 'assets/models13.glb', title: '侘び寂びの現代的解釈', description: '' },
      { src: 'assets/models14.glb', title: '日本の精神性を表現した3Dアート', description: '' }
    ];

    // Service Worker 登録（キャッシュ用）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }

    async function preloadModels() {
      try {
        const cache = await caches.open(CACHE_NAME);
        const preloadPromises = modelData.map(async model => {
          try {
            const response = await fetch(model.src);
            if (response.ok) {
              await cache.put(model.src, response.clone());
            }
          } catch (error) {
            console.warn(`Failed to preload ${model.src}:`, error);
          }
        });
        await Promise.all(preloadPromises);
      } catch (error) {
        console.warn('Preloading failed:', error);
      }
    }

    const gallery = document.getElementById('modelGallery');
    let loadedModels = 0;
    const totalModels = modelData.length;

    // モデルカード生成（src属性は後から IntersectionObserver で設定）
    modelData.forEach(model => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.innerHTML = `
        <div class="model-viewer-container">
          <model-viewer
              src="${model.src}"
              camera-controls
              auto-rotate
              shadow-intensity="1"
              exposure="1"
              alt="${model.title}"
              loading="lazy">
          </model-viewer>
        </div>
      `;
      gallery.appendChild(card);
      card.addEventListener('click', () => openModal(model));
    });

    function updateLoadingProgress() {
      const loading = document.getElementById('loading');
      const progress = (loadedModels / totalModels) * 100;
      const loadingText = document.querySelector('.loading-text');
      loadingText.textContent = `Loading 3D Models... ${Math.round(progress)}%`;

      if (loadedModels === totalModels) {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      }
    }

    // IntersectionObserver による Lazy Loading の実装
    document.addEventListener('DOMContentLoaded', () => {
      const modelViewers = document.querySelectorAll('model-viewer');
      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const viewer = entry.target;
            viewer.addEventListener('load', () => {
              loadedModels++;
              updateLoadingProgress();
            });
            observer.unobserve(viewer);
          }
        });
      }, { rootMargin: '0px 0px 0px 0px' });
      modelViewers.forEach(viewer => observer.observe(viewer));
    });

    const modal = document.getElementById('modal');
    const modalViewer = document.getElementById('modalViewer');
    const closeButton = document.querySelector('.close-button');

    function openModal(model) {
      modal.style.display = 'flex';
      modalViewer.src = model.src;
      modalViewer.setAttribute('auto-rotate', '');
      modalViewer.setAttribute('camera-controls', '');
      modalViewer.setAttribute('rotation-per-second', '30deg');
      
      requestAnimationFrame(() => {
        modal.classList.add('show');
      });
    }

    closeButton.addEventListener('click', () => {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 300);
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');
        setTimeout(() => {
          modal.style.display = 'none';
        }, 300);
      }
    });

    // 万が一、全モデルの読み込みイベントが発火しなかった場合のフォールバック（5秒後にローディング画面を非表示）
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading.style.display !== 'none') {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      }
    }, 5000);

    preloadModels();
  </script>
</body>
</html>
