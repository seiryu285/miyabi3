<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅 -MIYABI- | 3Dモデルギャラリー</title>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        :root {
            --main-color: #2D2D2D;
            --accent-color: #B70033;
            --bg-color: #FAFAFA;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Yu Mincho", "MS Mincho", serif;
            background-color: var(--bg-color);
            color: var(--main-color);
        }
        
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem;
            background-color: rgba(250, 250, 250, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        
        .logo {
            font-size: 2rem;
            text-decoration: none;
            color: var(--main-color);
            letter-spacing: 0.2em;
        }
        
        .nav-links {
            display: flex;
            gap: 3rem;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--main-color);
            font-size: 1rem;
            letter-spacing: 0.1em;
            position: relative;
            padding: 0.5rem 0;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .model-gallery {
            margin-top: 80px;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .model-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            /* 豪華なフレーム（グラデーションボーダー） */
            border: 3px solid;
            border-image: linear-gradient(45deg, #B70033, #2D2D2D, #B70033) 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        
        .model-viewer-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: #f5f5f5;
            transition: all 0.5s ease;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            will-change: transform;
        }
        
        .model-info {
            padding: 1rem;
            transition: all 0.3s ease;
        }
        
        .model-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--main-color);
        }
        
        .model-description {
            font-size: 0.9rem;
            color: #666;
        }
        
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .loading-text {
            color: white;
            font-size: 1.2rem;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.show {
            opacity: 1;
        }
        
        .modal-content {
            width: 90%;
            height: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 15px;
            padding: 2rem;
            position: relative;
            transform: scale(0.7) rotate(0deg);
            transition: transform 0.5s ease;
        }
        
        .modal.show .modal-content {
            transform: scale(1) rotate(360deg);
        }
        
        .modal model-viewer {
            width: 100%;
            height: calc(100% - 60px);
        }
        
        .close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            color: var(--main-color);
            cursor: pointer;
            border: none;
            background: none;
            padding: 0.5rem;
            line-height: 1;
        }
        
        .modal-title {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-size: 1.5rem;
            color: var(--main-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">雅</a>
        <nav class="nav-links">
            <a href="about.html">ABOUT</a>
            <a href="gallery.html">GALLERY</a>
            <a href="model-gallery.html">ITEMS</a>
        </nav>
    </header>

    <div class="model-gallery" id="modelGallery">
        <!-- 3Dモデルカードはスクリプトで動的に生成されます -->
    </div>

    <div id="loading" class="loading-container">
        <div class="loading-text">Loading 3D Models...</div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title"></h2>
            <button class="close-button">&times;</button>
            <model-viewer id="modalViewer"
                camera-controls
                auto-rotate
                rotation-per-second="30deg"
                shadow-intensity="1"
                exposure="1">
            </model-viewer>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // 最適化のためのフラグ
        const ENABLE_DRACO = true;
        const ENABLE_CACHE = true;
        const ENABLE_FRUSTUM_CULLING = true;

        // キャッシュの設定
        const CACHE_NAME = 'miyabi-3d-models-v1';
        const modelData = [
            { src: 'assets/models1.glb', title: '壱', description: '伝統と現代が融合した3Dアート作品' },
            { src: 'assets/models2.glb', title: '弐', description: '和の精神を表現した立体作品' },
            { src: 'assets/models3.glb', title: '参', description: '日本の美意識を形にした3Dデザイン' }
        ];

        // レンダラー、シーン、カメラの設定
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // DRACOローダーの設定と最適化
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        dracoLoader.preload(); // デコーダーを事前にロード

        const loader = new GLTFLoader();
        if (ENABLE_DRACO) {
            loader.setDRACOLoader(dracoLoader);
        }

        // プログレスバーの設定
        const progressBar = document.createElement('div');
        progressBar.style.position = 'fixed';
        progressBar.style.top = '50%';
        progressBar.style.left = '50%';
        progressBar.style.transform = 'translate(-50%, -50%)';
        progressBar.style.width = '200px';
        progressBar.style.height = '20px';
        progressBar.style.backgroundColor = '#f0f0f0';
        progressBar.style.border = '1px solid #000';
        document.body.appendChild(progressBar);

        const progressBarFill = document.createElement('div');
        progressBarFill.style.width = '0%';
        progressBarFill.style.height = '100%';
        progressBarFill.style.backgroundColor = '#4CAF50';
        progressBar.appendChild(progressBarFill);

        // モデルのロード処理を最適化
        async function loadModel(modelPath) {
            try {
                // キャッシュチェック
                if (ENABLE_CACHE) {
                    const cache = await caches.open(CACHE_NAME);
                    const cachedResponse = await cache.match(modelPath);
                    if (cachedResponse) {
                        const blob = await cachedResponse.blob();
                        const objectURL = URL.createObjectURL(blob);
                        return await new Promise((resolve, reject) => {
                            loader.load(objectURL, resolve, 
                                // Progress callback
                                (xhr) => {
                                    const percentComplete = (xhr.loaded / xhr.total) * 100;
                                    progressBarFill.style.width = `${percentComplete}%`;
                                },
                                reject
                            );
                        });
                    }
                }

                // キャッシュにない場合は通常のロード
                const model = await new Promise((resolve, reject) => {
                    loader.load(modelPath,
                        resolve,
                        (xhr) => {
                            const percentComplete = (xhr.loaded / xhr.total) * 100;
                            progressBarFill.style.width = `${percentComplete}%`;
                        },
                        reject
                    );
                });

                // キャッシュに保存
                if (ENABLE_CACHE) {
                    const cache = await caches.open(CACHE_NAME);
                    const response = await fetch(modelPath);
                    await cache.put(modelPath, response);
                }

                return model;
            } catch (error) {
                console.error('Error loading model:', error);
                progressBar.style.display = 'none';
                throw error;
            }
        }

        // レンダリングの最適化
        let needsUpdate = true;
        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // カメラの更新が必要な場合のみ実行
            if (needsUpdate) {
                controls.update(delta);
                
                // フラスタムカリングの適用
                if (ENABLE_FRUSTUM_CULLING) {
                    const frustum = new THREE.Frustum();
                    frustum.setFromProjectionMatrix(
                        new THREE.Matrix4().multiplyMatrices(
                            camera.projectionMatrix,
                            camera.matrixWorldInverse
                        )
                    );

                    scene.traverse((object) => {
                        if (object.isMesh) {
                            object.visible = frustum.intersectsObject(object);
                        }
                    });
                }

                renderer.render(scene, camera);
                needsUpdate = false;
            }
        };

        // コントロールの設定
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.addEventListener('change', () => needsUpdate = true);

        // ウィンドウリサイズ処理の最適化
        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const width = window.innerWidth;
                const height = window.innerHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
                needsUpdate = true;
            }, 100);
        });

        // 初期化処理
        async function init() {
            document.querySelector('.gallery-container').appendChild(renderer.domElement);
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 光源の設定
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 10, 0);
            scene.add(directionalLight);

            // モデルのロードと配置
            try {
                for (let i = 0; i < modelData.length; i++) {
                    const gltf = await loadModel(modelData[i].src);
                    const model = gltf.scene;
                    model.position.x = (i - 1) * 5;
                    scene.add(model);
                }
            } catch (error) {
                console.error('Failed to load models:', error);
            }

            progressBar.style.display = 'none';
            animate();
        }

        init();

        // Service Workerの登録
        if (ENABLE_CACHE && 'serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => console.log('ServiceWorker registered:', registration.scope))
                    .catch(error => console.error('ServiceWorker registration failed:', error));
            });
        }
    </script>
</body>
</html>
