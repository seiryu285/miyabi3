<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅 -MIYABI- | 記憶の円環</title>
    <style>
        :root {
            --main-color: #2D2D2D;
            --accent-color: #B70033;
            --bg-color: #FAFAFA;
            --memory-size: 300px;
            --transition-duration: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Yu Mincho", "MS Mincho", serif;
            background-color: var(--bg-color);
            color: var(--main-color);
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem;
            background-color: rgba(250, 250, 250, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .logo {
            font-size: 2rem;
            text-decoration: none;
            color: var(--main-color);
            letter-spacing: 0.2em;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--main-color);
            font-size: 1rem;
            letter-spacing: 0.1em;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .memories-container {
            margin-top: 100px;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--memory-size), 1fr));
            gap: 3rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .memory-circle {
            width: var(--memory-size);
            height: var(--memory-size);
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transition: transform var(--transition-duration) ease;
        }

        .memory-circle:hover {
            transform: scale(1.05);
        }

        .memory-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .memory-frame::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(45deg, var(--accent-color), transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 10s linear infinite;
        }

        .memory-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform var(--transition-duration) ease;
        }

        .memory-info {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity var(--transition-duration) ease;
        }

        .memory-circle:hover .memory-info {
            opacity: 1;
        }

        .memory-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--main-color);
        }

        .memory-description {
            font-size: 0.9rem;
            color: #666;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity var(--transition-duration) ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 1200px;
            position: relative;
        }

        .modal-video {
            width: 100%;
            aspect-ratio: 16/9;
        }

        .close-button {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">雅</a>
        <nav class="nav-links">
            <a href="about.html">ABOUT</a>
            <a href="gallery.html">GALLERY</a>
            <a href="model-gallery.html">ITEMS</a>
        </nav>
    </header>

    <div class="memories-container">
        <!-- 記憶の円環1 -->
        <div class="memory-circle" data-video-id="your-video-id-1">
            <div class="memory-frame">
                <video class="memory-video" muted loop playsinline>
                    <source src="path/to/your/video1.mp4" type="video/mp4">
                </video>
            </div>
            <div class="memory-info">
                <h3 class="memory-title">記憶の欠片 - 壱</h3>
                <p class="memory-description">時を超えて紡がれる物語</p>
            </div>
        </div>

        <!-- 記憶の円環2 -->
        <div class="memory-circle" data-video-id="your-video-id-2">
            <div class="memory-frame">
                <video class="memory-video" muted loop playsinline>
                    <source src="path/to/your/video2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="memory-info">
                <h3 class="memory-title">記憶の欠片 - 弐</h3>
                <p class="memory-description">永遠に刻まれる瞬間</p>
            </div>
        </div>

        <!-- 記憶の円環3 -->
        <div class="memory-circle" data-video-id="your-video-id-3">
            <div class="memory-frame">
                <video class="memory-video" muted loop playsinline>
                    <source src="path/to/your/video3.mp4" type="video/mp4">
                </video>
            </div>
            <div class="memory-info">
                <h3 class="memory-title">記憶の欠片 - 参</h3>
                <p class="memory-description">静寂の中に響く調べ</p>
            </div>
        </div>
    </div>

    <!-- モーダルウィンドウ -->
    <div class="modal">
        <div class="modal-content">
            <button class="close-button">&times;</button>
            <video class="modal-video" controls>
                <source src="" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // 動画の自動再生制御
        const memoryCircles = document.querySelectorAll('.memory-circle');
        const modal = document.querySelector('.modal');
        const modalVideo = modal.querySelector('.modal-video');
        const closeButton = modal.querySelector('.close-button');

        // Intersection Observer for video autoplay
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.5 });

        memoryCircles.forEach(circle => {
            videoObserver.observe(circle);

            // クリックイベントの追加
            circle.addEventListener('click', () => {
                const video = circle.querySelector('video');
                modalVideo.src = video.querySelector('source').src;
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                modalVideo.play();
            });
        });

        // モーダルを閉じる処理
        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                modalVideo.pause();
                modalVideo.src = '';
            }, 600);
        }

        closeButton.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // パフォーマンス最適化
        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // リサイズ時の処理をここに記述
            }, 100);
        });
    </script>
</body>
</html>
