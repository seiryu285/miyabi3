<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIYABI - Japanese Art NFT Collection | Gallery</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "Yu Mincho", "YuMincho", serif;
      background-color: #ffffff;
      overflow-x: hidden;
      color: #333;
      forced-color-adjust: none;
    }
    /* Navigation (for gallery page) */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4rem;
      z-index: 3;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 2rem;
      gap: 2rem;
      mix-blend-mode: difference;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), transparent);
    }
    
    .nav a, .nav button {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      padding: 0.5rem;
      opacity: 0.7;
      transition: all 0.5s ease;
      position: relative;
      white-space: nowrap;
    }
    
    .nav a::after, .nav button::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background: #fff;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }
    
    .nav a:hover::after, .nav button:hover::after {
      width: 100%;
    }
    
    .nav a:hover, .nav button:hover, .nav .active {
      opacity: 1;
    }
    
    /* 言語切り替えボタン */
    .lang-btn {
      background: none;
      border: none;
      color: white;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.5s ease;
      position: relative;
      white-space: nowrap;
      padding: 0.5rem;
    }
    
    .lang-btn:hover {
      opacity: 1;
    }
    
    .lang-btn.active {
      opacity: 1;
    }
    /* Gallery container */
    .gallery-container {
      padding: 2rem;
      margin-top: 140px;
      background-color: #ffffff;
    }
    /* ギャラリーのグリッド */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .gallery-item-number {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.875rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      z-index: 2;
    }
    /* NFT Detail Modal */
    .nft-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.3s ease;
    }
    .nft-modal::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: -1;
    }
    .modal-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: background-color 0.3s ease;
      z-index: -2;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: none;
    }
    @media (max-width: 768px) {
      .modal-overlay {
        display: block;
      }
    }
    .nft-modal.active {
      opacity: 1;
      display: flex;
    }
    .modal-content {
      position: relative;
      width: 95%;
      max-width: 1400px;
      height: 90vh;
      display: flex;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease, background-color 0.3s ease;
    }
    /* Fullscreen for video on mobile */
    @media (max-width: 768px) {
      .modal-content.video-active {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      .modal-content.video-active .modal-info {
        display: none;
      }
      .modal-content.video-active .modal-image video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        border-radius: 0;
      }
    }
    /* Desktop optimization for video */
    @media (min-width: 769px) {
      .modal-content.video-active {
        width: 90%;
        height: 80vh;
        border-radius: 12px;
        margin: auto;
      }
      .modal-content.video-active .modal-info {
        display: none;
      }
      .modal-content.video-active .modal-image video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 12px;
      }
    }
    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: transparent;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
      z-index: 100;
      padding: 0;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) and (pointer: fine) {
      .modal-close:hover {
        color: #FFD700;
      }
    }
    .modal-inner {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 2rem;
      padding: 1.5rem;
    }
    .modal-image {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 100%;
      padding: 1rem;
      position: relative;
    }
    .modal-image img,
    .modal-image video {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 16px;
    }
    /* Note: video tag does not include controls attribute so no native UI is shown */
    .modal-info {
      width: 400px;
      height: 100%;
      padding: 1.5rem;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .collection-row {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 0.75rem;
    }
    .modal-title {
      font-size: 2rem;
      line-height: 1.3;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #fff;
    }
    .modal-description {
      line-height: 1.8;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.9);
      white-space: pre-line;
      margin-bottom: 2rem;
    }
    .modal-traits {
      margin-bottom: 2rem;
    }
    .modal-traits h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    .trait-item {
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }
    .trait-type {
      font-weight: 500;
      opacity: 0.8;
    }
    .modal-details {
      font-size: 1rem;
    }
    .detail-item {
      margin-bottom: 0.75rem;
    }
    .detail-label {
      opacity: 0.8;
    }
    .modal-info::-webkit-scrollbar {
      width: 8px;
    }
    .modal-info::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .modal-info::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .modal-info::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    @media (max-width: 1024px) {
      .modal-inner {
        flex-direction: column;
        gap: 1.5rem;
      }
      .modal-info {
        width: 100%;
        max-height: 50vh;
      }
      .modal-image {
        padding: 0;
      }
      .modal-image img,
      .modal-image video {
        max-height: 40vh;
      }
      .modal-title {
        font-size: 1.75rem;
      }
      .modal-description {
        font-size: 1rem;
      }
    }
    @media (max-width: 768px) {
      .nav {
        right: 20px;
        top: 20px;
        gap: 15px;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
      .nft-modal {
        padding: 1rem;
      }
      .modal-content {
        height: 100vh;
        width: 100vw;
        border-radius: 0;
      }
      .modal-inner {
        padding: 1rem;
        gap: 1rem;
      }
      .modal-close {
        top: 1rem;
        right: 1rem;
        width: 36px;
        height: 36px;
        font-size: 1.25rem;
      }
    }
    .character-description-section {
      margin-bottom: 2rem;
    }
    .character-description-title {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    .character-description-content {
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .character-idiom-section {
      margin-bottom: 1.5rem;
    }
    .character-idiom-title {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .character-idiom {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .character-idiom-meaning {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>

      // ギャラリーを生成する関数
      function generateGallery() {
        const galleryGrid = document.querySelector('.gallery-grid');
        galleryGrid.innerHTML = ''; // 既存の内容をクリア
        
        // 各NFTアイテムをループして表示
        nftData.forEach(nft => {
          // ギャラリーアイテム要素を作成
          const galleryItem = document.createElement('div');
          galleryItem.className = 'gallery-item';
          galleryItem.setAttribute('data-id', nft.id);
          
          // NFT番号を表示
          const nftNumber = document.createElement('div');
          nftNumber.className = 'gallery-item-number';
          nftNumber.textContent = `#${nft.id.toString().padStart(3, '0')}`;
          
          // 画像要素を作成
          const img = document.createElement('img');
          img.src = nft.image;
          img.alt = nft.title;
          img.onerror = function() {
            console.error(`Failed to load image: ${nft.image}`);
            // エラー時の代替画像を表示
            this.src = 'assets/placeholder.jpg';
          };
          
          // 要素を追加
          galleryItem.appendChild(nftNumber);
          galleryItem.appendChild(img);
          galleryGrid.appendChild(galleryItem);
          
          // クリックイベントを追加（モーダル表示用）
          galleryItem.addEventListener('click', function() {
            openModal(nft);
          });
        });
      }

          modalImage.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = modalImage.width;
              canvas.height = modalImage.height;
              ctx.drawImage(modalImage, 0, 0);
              
              // 画像の背景色を抽出（左側中央部分から色を取得）
              const x = Math.floor(modalImage.width * 0.1); // 左から10%の位置
              const y = Math.floor(modalImage.height * 0.5); // 縦の中央
              const imageData = ctx.getImageData(x, y, 1, 1).data;
              const bgColor = `rgb(${imageData[0]}, ${imageData[1]}, ${imageData[2]})`;
              
              // モーダルの背景色を設定
              modalBackground.style.backgroundColor = bgColor;
              modalContent.style.backgroundColor = bgColor;
              modalInfo.style.backgroundColor = bgColor;
              modalInfo.style.color = '#fff';
              modalTitle.style.color = '#fff';
              
              // モバイル表示の場合はオーバーレイの背景色も設定
              if (window.innerWidth <= 768) {
                const modalOverlay = document.querySelector('.modal-overlay');
                if (modalOverlay) {
                  modalOverlay.style.backgroundColor = bgColor;
                }
              }
            } catch (e) {
              console.error("Error extracting background color:", e);
            }
          };
        }
        
        // モーダルを表示
        modal.style.display = 'flex';
        
        // 動画がある場合は動画を表示、ない場合は画像を表示
        if (nft.video && nft.video !== "") {
          modalVideo.src = nft.video;
          modalVideo.style.display = 'block';
          modalImage.style.display = 'none';
          modalVideo.play();
        } else {
          modalVideo.style.display = 'none';
          modalImage.style.display = 'block';
        }
      }
      
      // モーダルを閉じる処理
      document.querySelector('.modal-close').addEventListener('click', function() {
        const modal = document.getElementById('nftModal');
        const modalVideo = document.getElementById('modalVideo');
        
        modal.style.display = 'none';
        modalVideo.pause();
      });
      
      document.querySelector('.modal-overlay').addEventListener('click', function() {
        const modal = document.getElementById('nftModal');
        const modalVideo = document.getElementById('modalVideo');
        
        modal.style.display = 'none';
        modalVideo.pause();
      });
      
      // 言語切り替え処理
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentLang = this.getAttribute('data-lang');
          updateLanguage();
        });
      });
      
      function updateLanguage() {
        // 翻訳要素を更新
        document.querySelectorAll('[data-translate]').forEach(el => {
          const key = el.getAttribute('data-translate');
          const keys = key.split('.');
          let translation = translations[currentLang];
          
          for (const k of keys) {
            if (translation[k] !== undefined) {
              translation = translation[k];
            } else {
              translation = key;
              break;
            }
          }
          
          el.textContent = translation;
        });
        
        // ギャラリーを再生成
        generateGallery();
      }
      
      // RGBを16進数に変換する関数
      function rgbToHex(r, g, b) {
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }
      
      // 初期化処理
      generateGallery();
      updateLanguage();
    });
  </script>
</body>
</html>
